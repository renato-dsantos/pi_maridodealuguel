<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Cliente</title>
    <link rel="stylesheet" href="../estilos/clientes_prestador.css">
</head>
<body>
     <header>
        <a href="../index.html">
        <img src="../img/logo.png" alt="Logo do Site" class="logo" >
        </a>

        <nav>
                <button onclick="window.location.href='../index.html';">Sair</button> 
                
            </nav>
    </header>
    <main>
        <div class="admin-layout">
        <div class="tab">
        <button class="tablinks" onclick="openTabs(event, 'clientes')">Dados pessoais</button>
        <button class="tablinks" onclick="openTabs(event, 'prestador_serviços')">Serviços solicitados</button>
        </div>
        
                 <div id="clientes" class="tabcontent">
                    <h3>Dados pessoais</h3> 
                       <form id="formDadosPessoais">
                            <div>
                                <label>Nome</label>
                                <input type="text" id="nome" name="nome">
                            </div>
                            <div>
                                <label>Email</label>
                                <input type="email" id="email" name="email">
                            </div>

                            <div>
                                <label>Telefone</label>
                                <input type="text" id="telefone" name="telefone">
                            </div>
                            <div>
                                <label>CEP</label>
                                <input type="text" id="cep" name="cep">
                            </div>
                            <div>
                                <label>Rua</label>
                                <input type="text" id="rua" name="rua">
                            </div>
                            <div>
                                <label>Bairro</label>
                                <input type="text" id="bairro" name="bairro">
                            </div>
                            <div>
                                <label>Cidade</label>
                                <input type="text" id="cidade" name="cidade">
                            </div>
                            <div>
                                <label>Estado</label>
                                <input type="text" id="estado" name="estado">
                            </div>

                            <button type="submit" id="btnSalvar">Salvar alterações</button>
                        </form>
                    </div>

         <div id="prestador_serviços" class="tabcontent">
                    <h3>Serviços solicitados</h3>
                    
                    <table id="tabelaPrestador">  
                                    
                            <thead>
                                    <th>Código do prestador</th>
                                    <th>Nome</th>
                                    <th>Email</th>
                                    <th>Telefone</th>
                                    <th>Serviço</th>
                                    <th>Data do serviço</th>
                                    <th>Descrição</th>
                                    <th>Excluir</th>  
                                </thead> 
                            <tbody>   
                                                    
                            </tbody>
                    </table> 
        </div>

    
    </div>    
    </main>
    <script src="../js/cliente.js"></script>
</body>
</html>
