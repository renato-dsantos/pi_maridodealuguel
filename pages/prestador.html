<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Prestador</title>
    <link rel="stylesheet" href="../estilos/clientes_prestador.css">
</head>
<body>
     <header>
        <a href="../index.html">
        <img src="../img/logo.png" alt="Logo do Site" class="logo" >
        </a>

        <nav>
                <button onclick="window.location.href='../index.html';">Sair</button> 
                
            </nav>
    </header>
    <main>
        <div class="admin-layout">
        <div class="tab">
        <button class="tablinks" onclick="openTabs(event, 'clientes')">Dados pessoais</button>
        <button class="tablinks" onclick="openTabs(event, 'prestador_serviços')">Serviços solicitados</button>
        </div>
        
                 <div id="clientes" class="tabcontent">
                    <h3>Dados pessoais</h3> 
                        <form id="formDadosPrestador">
                    <div>
                        <label>Nome</label>
                        <input type="text" id="nome" name="nome">
                    </div>
                    <div>
                        <label>Email</label>
                        <input type="email" id="email" name="email">
                    </div>
                    <div>
                        <label>Telefone</label>
                        <input type="text" id="telefone" name="telefone">
                    </div>
                    <div>
                        <label>Serviço</label>
                        <input type="text" id="servicos" name="servicos">
                    </div>
                    <div>
                        <label>Descrição</label>
                        <input type="text" id="descricao" name="descricao">
                    </div>
                    <button type="submit" id="btnSalvar">Salvar alterações</button>
                </form>
                       
                           
                    </div>
                

         <div id="prestador_serviços" class="tabcontent">
                    <h3>Serviços solicitados</h3>
                    
                    <table id="tabelaPrestador">  
                                    
                            <thead>
                                    <th>Nome</th>
                                    <th>Email</th>
                                    <th>Telefone</th>
                                    <th>Serviço</th>
                                    <th>Data do serviço</th>
                                    <th>Descrição</th>
                                    <th>Aceitar</th>
                                    <th>Recusar</th>                                     
                                </thead> 
                            <tbody>   
                                                    
                            </tbody>
                    </table> 
        </div>

    
    </div>    
    </main>
    <script src="../js/prestador.js"></script>
</body>
</html>
